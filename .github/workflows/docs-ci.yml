name: Docs CI

# Quality gates for every PR into the living-docs corpus. All three jobs
# must pass before auto-merge: markdown lint, offline (internal-only) link
# check, and a strict MkDocs build. External links are deliberately NOT
# checked here — a flaky third-party site must never block the autonomous
# sync pipeline.

on:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"

  links:
    name: Internal link check (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Check internal links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true

  build:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs toolchain
        run: pip install -r requirements.txt

      - name: Build site (strict)
        run: mkdocs build --strict
