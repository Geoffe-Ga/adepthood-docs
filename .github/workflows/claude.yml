name: Claude Code

# Interactive @claude workflow for on-demand doc edits. Mention @claude in
# an issue, issue comment, PR comment, or PR review and Claude opens a PR
# with the requested change. Unlike the autonomous sync pipeline, PRs from
# this workflow are merged by a human — auto-merge is deliberately NOT
# enabled here.
#
# Owner prerequisite: the CLAUDE_CODE_OAUTH_TOKEN repository secret must be
# set before runs can succeed.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        github.event.sender.login == 'Geoffe-Ga' ||
        github.event.sender.login == 'claude[bot]' ||
        (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'issue_comment' && github.event.comment.author_association == 'MEMBER') ||
        (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'MEMBER') ||
        (github.event_name == 'pull_request_review' && github.event.review.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review' && github.event.review.author_association == 'MEMBER') ||
        (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER') ||
        (github.event_name == 'issues' && github.event.issue.author_association == 'MEMBER')
      ) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      # OIDC token for the claude action's auth exchange — without it every
      # mention-triggered run fails with "Could not fetch an OIDC token".
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Docs-repo instructions: follow the taxonomy, satisfy the Docs CI
          # gates, and leave merging to a human.
          claude_args: >-
            --append-system-prompt "This is the Adepthood living-docs corpus.
            Before filing or editing any page, read CLAUDE.md and follow its
            Taxonomy Filing Rules: every page lives in exactly one category
            under docs/ (architecture, decisions, design, how-to,
            contributing, products, changelog), each category's index.md
            carries the authoritative inclusion criteria, and you must never
            add a nav: key to mkdocs.yml — navigation is derived from the
            directory tree. ADRs use docs/decisions/NNNN-slug.md with exactly
            the sections Status, Context, Decision, Consequences. Any PR you
            open must pass the Docs CI gates: markdownlint-cli2, the offline
            internal link check (lychee), and mkdocs build --strict — never
            weaken these gates to get a PR through. PRs from this interactive
            workflow are reviewed and merged by a human: do not enable
            auto-merge and do not merge them yourself."
