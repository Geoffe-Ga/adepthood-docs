name: Pages Deploy

# Publishes the MkDocs site to GitHub Pages on every merge to main (and on
# demand via workflow_dispatch). Build and deploy are separate jobs: the
# build must pass `mkdocs build --strict` before anything is deployed.
#
# Owner prerequisite: Settings -> Pages -> Source must be "GitHub Actions".
# configure-pages runs with `enablement: true` as a best-effort auto-enable,
# but the built-in GITHUB_TOKEN may lack the admin scope that requires. If
# Pages is not enabled, configure-pages (or deploy-pages) fails loudly —
# that is intentional; do not swallow the error.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure GitHub Pages (best-effort auto-enable)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true

      - name: Install docs toolchain
        run: pip install -r requirements.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Note on failure mode
        run: echo "If this deploy fails with a Pages-not-enabled error, set Settings -> Pages -> Source to 'GitHub Actions' and re-run."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
