site_name: Adepthood Docs
site_url: https://docs.aptitude.guru/
site_description: >-
  Living documentation corpus for the five-repo Adepthood ecosystem,
  maintained by an autonomous sync pipeline.
repo_url: https://github.com/Geoffe-Ga/adepthood-docs
repo_name: Geoffe-Ga/adepthood-docs

docs_dir: docs

# Navigation is derived from the directory tree by the awesome-pages plugin.
# Do NOT add a `nav:` key — new pages must appear without config edits.
# Section ordering lives in `docs/.pages` (static config; the sync agent
# never touches it).
theme:
  name: material
  # Candle & Ink uses platform-system font stacks only (no Google Fonts,
  # no bundled faces) — the stacks are supplied by stylesheets/extra.css.
  font: false
  # `custom` defers all color decisions to stylesheets/extra.css, where the
  # Candle & Ink tokens (canvas / ink / terracotta) map onto Material's
  # CSS custom properties for both schemes.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # Folds `securityLevel: loose` into Material's own mermaid init so the
  # `click` directives in architecture/the-loop.md resolve to links.
  # Mermaid defaults to `strict`, which disables them silently.
  - javascripts/mermaid-config.js

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  # Collapsible `???` admonitions. `admonition` alone renders only the
  # static `!!!` form; without this a `???` block loses its disclosure
  # arrow and renders permanently open.
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
